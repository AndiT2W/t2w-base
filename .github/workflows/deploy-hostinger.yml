name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify event service
        run: |
          npm ci --prefix services/event-service
          npm run prisma:generate --prefix services/event-service
          npm test --prefix services/event-service
          npm run build --prefix services/event-service

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$HOSTINGER_PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Package current commit
        run: git archive --format=tar.gz --output=/tmp/t2w-base-${GITHUB_SHA}.tar.gz HEAD

      - name: Upload release archive
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || 'root' }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          scp -P "$HOSTINGER_PORT" /tmp/t2w-base-${GITHUB_SHA}.tar.gz \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/t2w-base-${GITHUB_SHA}.tar.gz"

      - name: Extract and rebuild application and event service
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || 'root' }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH || '/docker/t2w-base' }}
        run: |
          ssh -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          deploy_path=$1
          commit_sha=$2

          for required_file in \
            "$deploy_path/docker-compose.yml" \
            "$deploy_path/.env"
          do
            if [ ! -f "$required_file" ]; then
              echo "Erforderliche Deployment-Datei fehlt: $required_file"
              exit 1
            fi
          done
          tar -xzf "/tmp/t2w-base-$commit_sha.tar.gz" -C "$deploy_path" --overwrite
          docker compose -f "$deploy_path/docker-compose.yml" up -d --build app nginx event-db event-service event-backup
          docker compose -f "$deploy_path/docker-compose.yml" --profile migrate run --rm -T event-migrate </dev/null
          docker compose -f "$deploy_path/docker-compose.yml" ps
          event_router_containers=$(docker ps -q \
            --filter label=traefik.http.routers.t2w-events.rule)
          event_router_count=$(printf '%s\n' "$event_router_containers" | sed '/^$/d' | wc -l)
          docker ps --filter label=traefik.http.routers.t2w-events.rule \
            --format 'Event-Router-Container: {{.Names}} ({{.Image}})'
          if [ "$event_router_count" -ne 1 ]; then
            echo "Erwartet genau einen Event-Router-Container, gefunden: $event_router_count"
            exit 1
          fi
          rm -f "/tmp/t2w-base-$commit_sha.tar.gz"
          REMOTE
