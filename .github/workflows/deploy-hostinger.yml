name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify event service
        run: |
          npm ci --prefix services/event-service
          npm run prisma:generate --prefix services/event-service
          npm test --prefix services/event-service
          npm run build --prefix services/event-service

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$HOSTINGER_PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Package current commit
        run: git archive --format=tar.gz --output=/tmp/t2w-base-${GITHUB_SHA}.tar.gz HEAD

      - name: Upload release archive
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || 'root' }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          scp -P "$HOSTINGER_PORT" /tmp/t2w-base-${GITHUB_SHA}.tar.gz \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/t2w-base-${GITHUB_SHA}.tar.gz"

      - name: Extract and rebuild application and event service
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || 'root' }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH || '/docker/t2w-base' }}
          EVENT_DEPLOY_PATH: ${{ secrets.HOSTINGER_EVENT_DEPLOY_PATH || '/docker/t2w-events' }}
        run: |
          ssh -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            bash -s -- "$DEPLOY_PATH" "$EVENT_DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          deploy_path=$1
          event_deploy_path=$2
          commit_sha=$3

          if [ ! -f "$event_deploy_path/.env.events" ]; then
            event_container=$(docker ps -aq --filter label=com.docker.compose.service=event-service | head -n 1)
            if [ -z "$event_container" ]; then
              echo "Event-Service-Container mit Compose-Label nicht gefunden."
              exit 1
            fi
            event_deploy_path=$(docker inspect \
              --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' \
              "$event_container")
          fi

          if [ -f "$event_deploy_path/.env.events" ]; then
            event_env_file="$event_deploy_path/.env.events"
          else
            event_env_file="$event_deploy_path/.env"
          fi

          echo "Event-Service-Verzeichnis: $event_deploy_path"
          for required_file in \
            "$deploy_path/docker-compose.hostinger.yml" \
            "$event_deploy_path/docker-compose.events.yml" \
            "$event_env_file"
          do
            if [ ! -f "$required_file" ]; then
              echo "Erforderliche Deployment-Datei fehlt: $required_file"
              exit 1
            fi
          done
          tar -xzf "/tmp/t2w-base-$commit_sha.tar.gz" -C "$deploy_path" --overwrite
          tar -xzf "/tmp/t2w-base-$commit_sha.tar.gz" -C "$event_deploy_path" --overwrite
          docker compose -f "$deploy_path/docker-compose.hostinger.yml" up -d --build app nginx
          docker compose --env-file "$event_env_file" \
            -f "$event_deploy_path/docker-compose.events.yml" build event-service event-migrate
          docker compose --env-file "$event_env_file" \
            -f "$event_deploy_path/docker-compose.events.yml" run --rm -T event-migrate </dev/null
          docker compose --env-file "$event_env_file" \
            -f "$event_deploy_path/docker-compose.events.yml" up -d event-service event-backup
          docker compose -f "$deploy_path/docker-compose.hostinger.yml" ps
          docker compose --env-file "$event_env_file" \
            -f "$event_deploy_path/docker-compose.events.yml" ps
          rm -f "/tmp/t2w-base-$commit_sha.tar.gz"
          REMOTE
