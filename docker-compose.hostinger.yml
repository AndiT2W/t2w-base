services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.hostinger
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx/hostinger.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.deploy/htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - internal
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.t2w-base.entrypoints=websecure
      - traefik.http.routers.t2w-base.rule=Host(`base.time2win.cloud`)
      - traefik.http.routers.t2w-base.tls=true
      - traefik.http.routers.t2w-base.tls.certresolver=letsencrypt
      - traefik.http.services.t2w-base.loadbalancer.server.port=80

networks:
  internal:
    driver: bridge
  traefik_proxy:
    external: true
